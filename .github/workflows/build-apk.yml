name: Build Production Android Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Signed Release APK & Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          npm install

      - name: Add Android Platform & Assets
        run: |
          mkdir -p www
          CI=true npx cap add android || true
          CI=true npx cap sync android

      - name: Inject Custom App Branding Icon
        run: |
          cat << 'EOF' > icon.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
            <rect width="512" height="512" rx="110" fill="#0b0f19"/>
            <circle cx="256" cy="256" r="190" stroke="#10b981" stroke-width="20" fill="none"/>
            <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="120" font-weight="900" fill="#10b981">WPC</text>
          </svg>
          EOF

          sudo apt-get update && sudo apt-get install -y imagemagick
          convert -background none icon.svg -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png || true
          convert -background none icon.svg -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png || true
          convert -background none icon.svg -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png || true
          convert -background none icon.svg -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
          convert -background none icon.svg -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true

      - name: Generate Release Signing Key
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias wpc-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass wpcsecurepass123 \
            -keypass wpcsecurepass123 \
            -dname "CN=WPC, OU=Mobile, O=WPC, L=Chicago, ST=IL, C=US"

      - name: Build Signed Release APK and App Bundle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=release.keystore \
            -Pandroid.injected.signing.store.password=wpcsecurepass123 \
            -Pandroid.injected.signing.key.alias=wpc-key \
            -Pandroid.injected.signing.key.password=wpcsecurepass123

      - name: Upload Signed Production APK
        uses: actions/upload-artifact@v4
        with:
          name: WPC-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Upload Google Play Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: WPC-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
