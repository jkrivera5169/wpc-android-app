name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          npm install

      - name: Validate Web Assets
        run: |
          # If index.html is nested under www/www/, pull it up to www/
          if [ -f www/www/index.html ]; then
            cp www/www/index.html www/index.html
          fi

          # Ensure www folder and index.html exist
          mkdir -p www
          if [ ! -f www/index.html ]; then
            echo "<!DOCTYPE html><html><body><h1>WPC App</h1></body></html>" > www/index.html
          fi

      - name: Add Android Platform & Sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: WPC-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
